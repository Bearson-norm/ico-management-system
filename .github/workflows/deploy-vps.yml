name: Deploy VPS

# Deploy only after CI succeeds on main/master (fail-fast: no deploy on red CI).
# Manual runs still allowed via workflow_dispatch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            if [ -z "$APP_PATH" ]; then
              APP_PATH="/var/www/ico-management-system"
            fi
            cd "$APP_PATH"
            export PATH="$APP_PATH/node_modules/.bin:$PATH:/usr/local/bin:/usr/bin"
            export NODE_ENV=production
            export NODE_OPTIONS="--max-old-space-size=2048"

            # 1. Mutex file lock: mencegah tabrakan jika ada 2 deployment/proses bersamaan
            exec 200>/tmp/ico_vps_deploy.lock
            echo ">>> Acquiring deployment lock (menunggu jika ada proses lain)..."
            flock -x -w 300 200 || { echo "ERR: Gagal mendapatkan deploy lock setelah 5 menit"; exit 1; }

            echo ">>> Deploy cwd: $(pwd)"
            echo ">>> SSH user: $(whoami)"

            if ! git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$APP_PATH"; then
              git config --global --add safe.directory "$APP_PATH"
            fi

            # 2. Bersihkan seluruh stale lock files secara tuntas
            find .git -name "*.lock" -type f -delete 2>/dev/null || true
            rm -f odoo_sync_debug.txt || true

            # 3. Fetch dengan retry jika koneksi berkedip
            git fetch origin || (sleep 3 && git fetch origin)

            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              TARGET_BRANCH="${{ github.event.workflow_run.head_branch }}"
              TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
            else
              TARGET_BRANCH="${{ github.ref_name }}"
              TARGET_SHA=""
            fi

            echo ">>> Deploying branch: $TARGET_BRANCH${TARGET_SHA:+ @ $TARGET_SHA}"
            git checkout -f "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            if [ -n "$TARGET_SHA" ]; then
              # Pin to the exact commit CI verified (avoids race with a newer push).
              git checkout -f "$TARGET_SHA"
            fi

            echo ">>> Running npm install..."
            npm install --include=dev --no-audit --no-fund

            echo ">>> Running Prisma Generate..."
            ./node_modules/.bin/prisma generate --schema=prisma/mtc/schema.prisma || npx prisma generate --schema=prisma/mtc/schema.prisma
            ./node_modules/.bin/prisma generate --schema=prisma/ga/schema.prisma || npx prisma generate --schema=prisma/ga/schema.prisma

            echo ">>> Building Next.js application..."
            ./node_modules/.bin/next build || npm run build

            echo ">>> Restarting PM2 inventory service..."
            if pm2 describe inventory >/dev/null 2>&1; then
              pm2 restart inventory || pm2 restart ecosystem.config.cjs --only inventory --update-env
            else
              pm2 start ecosystem.config.cjs || pm2 start inventory
            fi
            pm2 save

            echo ">>> Clean VPS SSH deployment finished successfully!"
