name: Deploy VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            if [ -z "$APP_PATH" ]; then
              APP_PATH="/var/www/ico-management-system"
            fi
            cd "$APP_PATH"
            export PATH=$PATH:./node_modules/.bin:/usr/local/bin:/usr/bin
            export NODE_ENV=production
            export NODE_OPTIONS="--max-old-space-size=2048"

            echo ">>> Deploy cwd: $(pwd)"
            echo ">>> SSH user: $(whoami)"

            if ! git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$APP_PATH"; then
              git config --global --add safe.directory "$APP_PATH"
            fi

            rm -f odoo_sync_debug.txt || true
            git fetch origin
            TARGET_BRANCH="${{ github.ref_name }}"
            echo ">>> Deploying branch: $TARGET_BRANCH"
            git checkout -f "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            echo ">>> Running npm ci..."
            npm ci --no-audit --no-fund --prefer-offline --include=dev || npm install --no-audit --no-fund

            echo ">>> Running Prisma Generate..."
            npx prisma generate --schema=prisma/mtc/schema.prisma
            npx prisma generate --schema=prisma/ga/schema.prisma

            echo ">>> Building Next.js application..."
            npm run build

            echo ">>> Restarting PM2 inventory service..."
            if pm2 describe inventory >/dev/null 2>&1; then
              pm2 restart inventory || pm2 restart ecosystem.config.cjs --only inventory --update-env
            else
              pm2 start ecosystem.config.cjs || pm2 start inventory
            fi
            pm2 save

            echo ">>> Clean VPS SSH deployment finished successfully!"
